<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNDERTALE: LAST NIGHT</title>
  <meta name="description" content="Playable 4-phase Undertale fan game with 16 non-repeating attacks, original 138-168 BPM Web Audio OST, Twilight Antechamber, and W.D. Gaster 4th-wall breaks.">
  <meta name="theme-color" content="#050508">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:title" content="UNDERTALE: LAST NIGHT">
  <meta property="og:description" content="4-Phase playable Undertale fan game with 16 non-repeating attacks, original 138-168 BPM Web Audio soundtrack, and W.D. Gaster 4th-wall breaks.">
  <meta property="og:url" content="https://efeartn.github.io/UndertaleLastNight/">
  <meta property="og:image" content="https://efeartn.github.io/UndertaleLastNight/assets/og-preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="UNDERTALE: LAST NIGHT">
  <meta name="twitter:image" content="https://efeartn.github.io/UndertaleLastNight/assets/og-preview.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="hud-bar" aria-label="Game controls">
      <div class="hud-brand">
        <img src="assets/logo.png" alt="UNDERTALE: LAST NIGHT Logo" class="brand-logo" width="24" height="24">
        <span class="brand-title">UNDERTALE: LAST NIGHT</span>
        <span id="hudModePill" class="mode-pill">TITLE</span>
      </div>
      <div class="hud-actions">
        <div class="audio-group" aria-label="Audio settings">
          <button id="btnMute" class="hud-btn" type="button" title="Toggle Audio (M)">🔊 Audio</button>
          <label class="vol-wrap" title="Master Volume">
            <span>VOL</span>
            <input id="rngVolume" type="range" min="0" max="100" value="72" aria-label="Master Volume">
          </label>
        </div>
        <button id="btnCRT" class="hud-btn" type="button" title="Toggle CRT Scanlines">📺 CRT</button>
        <button id="btnAssist" class="hud-btn" type="button" title="Practice Assist (No Death)">🛡 Assist</button>

        <div class="phase-jump-group" aria-label="Quick Phase Jump & Modes">
          <span class="hud-label">Play:</span>
          <button id="btnJumpOverworld" class="hud-btn hud-btn-sm" type="button" title="Start Overworld Story">Hall</button>
          <button id="btnJumpP1" class="hud-btn hud-btn-sm" type="button" title="Jump to Phase 1">P1</button>
          <button id="btnJumpP2" class="hud-btn hud-btn-sm" type="button" title="Jump to Phase 2">P2</button>
          <button id="btnJumpP3" class="hud-btn hud-btn-sm" type="button" title="Jump to Phase 3">P3</button>
          <button id="btnJumpP4" class="hud-btn hud-btn-sm" type="button" title="Jump to Phase 4 (Void Fracture)">P4</button>
          <button id="btnAttackSelect" class="hud-btn hud-btn-sm" type="button" title="Browse & Practice All 16 Attacks">🎯 Attacks</button>
          <button id="btnBossRush" class="hud-btn hud-btn-sm" type="button" title="Fight All 16 Attacks Back-to-Back">🔥 Rush</button>
          <button id="btnEndless" class="hud-btn hud-btn-sm" type="button" title="Endless Survival Mode (Phases 2-4)">∞ Endless</button>
        </div>

        <button id="btnAchievements" class="hud-btn" type="button" title="View Unlocked Trophies">🏆 Trophies (<span id="achCount">0/8</span>)</button>
        <button id="btnFullscreen" class="hud-btn" type="button" title="Fullscreen">⛶</button>
      </div>
    </header>

    <main class="stage-wrap">
      <div id="canvasShell" class="canvas-shell">
        <canvas id="gameCanvas" width="640" height="480" tabindex="0"></canvas>
        <div id="crtOverlay" class="crt-overlay hidden" aria-hidden="true"></div>
      </div>

      <div class="controls-strip">
        <span><strong>Move / Aim Shield:</strong> Arrows / WASD</span>
        <span><strong>Confirm / Shoot / Charge Shot:</strong> Z / Enter (Hold for Big Shot)</span>
        <span><strong>Back / Skip:</strong> X / Shift</span>
        <span><strong>Menu:</strong> C / Esc</span>
        <span><strong>Mouse:</strong> Click Menus &amp; Buttons</span>
      </div>

      <!-- Touch / Mouse Fallback Pad -->
      <div class="touch-controls" aria-label="On-screen controls">
        <div class="dpad">
          <button class="pad-btn pad-up" data-key="ArrowUp" type="button">▲</button>
          <div class="dpad-mid">
            <button class="pad-btn pad-left" data-key="ArrowLeft" type="button">◀</button>
            <button class="pad-btn pad-down" data-key="ArrowDown" type="button">▼</button>
            <button class="pad-btn pad-right" data-key="ArrowRight" type="button">▶</button>
          </div>
        </div>
        <div class="action-buttons">
          <button class="act-btn act-z" data-key="KeyZ" type="button">Z<small>OK</small></button>
          <button class="act-btn act-x" data-key="KeyX" type="button">X<small>BACK</small></button>
          <button class="act-btn act-c" data-key="KeyC" type="button">C<small>MENU</small></button>
        </div>
      </div>
    </main>
  </div>

  <!-- Trophies & Achievements Modal -->
  <div id="achievementsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="achModalTitle">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="achModalTitle">★ HALL OF DETERMINATION — TROPHIES</h2>
        <button id="btnCloseAchievements" class="hud-btn hud-btn-sm" type="button" aria-label="Close">✕</button>
      </div>
      <div id="achSummary" class="ach-summary"></div>
      <div id="achGrid" class="ach-grid"></div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
